services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: banking_test
      POSTGRES_PASSWORD: banking_test
      POSTGRES_DB: banking_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking_test -d banking_test"]
      interval: 2s
      timeout: 2s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
